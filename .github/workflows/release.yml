name: Release (Windows NSIS Installer)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-windows-installer:
    runs-on: windows-latest
    env:
      BALCOM_FLASH_TOOL_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/esptool.exe

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: packaging/flasher/requirements-ci.txt

      - name: Set up MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          path-type: inherit
          cache: true
          install: >-
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-make
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-gtk4
            mingw-w64-x86_64-glib2
            mingw-w64-x86_64-gdk-pixbuf2
            mingw-w64-x86_64-adwaita-icon-theme
            mingw-w64-x86_64-hicolor-icon-theme

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y
          & "C:\Program Files (x86)\NSIS\makensis.exe" /VERSION

      - name: Build standalone esptool (PyInstaller)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging\flasher\requirements-ci.txt

          New-Item -ItemType Directory -Force -Path build\esptool-asset | Out-Null

          python -m PyInstaller packaging\flasher\esptool_wrapper.py `
            --onefile `
            --name esptool `
            --distpath build\esptool-asset `
            --workpath build\esptool-asset\_pyi_build `
            --specpath build\esptool-asset\_pyi_spec

          if (-not (Test-Path build\esptool-asset\esptool.exe)) {
            throw "Expected build/esptool-asset/esptool.exe to be created"
          }

          # Make the built esptool.exe available both to CMake (for bundling
          # into the installer) and as a standalone GitHub Release asset.
          New-Item -ItemType Directory -Force -Path packaging\flasher | Out-Null
          Copy-Item build\esptool-asset\esptool.exe packaging\flasher\esptool.exe -Force

          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath build\esptool-asset\esptool.exe).Hash.ToLower()
          "BALCOM_FLASH_TOOL_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Toolchain sanity check
        shell: msys2 {0}
        run: |
          set -euo pipefail
          echo "MSYSTEM=$MSYSTEM"
          which cmake
          cmake --version
          which pkg-config
          pkg-config --version
          pkg-config --modversion gtk4

      - name: Verify MSYS2 runtime files (fast fail)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          _runner_tmp_win="$(cygpath -m "${RUNNER_TEMP}")"
          _prefix="${_runner_tmp_win}/msys64/mingw64"
          test -f "${_prefix}/bin/libgtk-4-1.dll"
          test -f "${_prefix}/bin/libglib-2.0-0.dll"
          test -f "${_prefix}/bin/glib-compile-schemas.exe"
          test -f "${_prefix}/bin/gdk-pixbuf-query-loaders.exe"
          test -d "${_prefix}/share/icons/Adwaita"
          test -d "${_prefix}/share/icons/hicolor"

      - name: Configure (installer preset)
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # msys2/setup-msys2 installs MSYS2 under RUNNER_TEMP (e.g. D:\a\_temp\msys64), not C:\msys64.
          _runner_tmp="${RUNNER_TEMP:-}"
          _runner_tmp_win=""
          if [ -n "${_runner_tmp}" ]; then
            _runner_tmp_win="$(cygpath -m "${_runner_tmp}")"
          fi
          if [ -z "${_runner_tmp_win}" ]; then
            echo "RUNNER_TEMP is empty; falling back to C:/msys64" >&2
            _runner_tmp_win="C:"
          fi
          cmake --preset win-release-installer \
            -DMSYS2_MINGW64_PREFIX="${_runner_tmp_win}/msys64/mingw64" \
            -DCPACK_TEMPORARY_DIRECTORY="${_runner_tmp_win}/cpack-tmp" \
            -DBALCOM_INSTALLER_DOWNLOAD_FLASH_TOOL=ON \
            -DBALCOM_FLASH_TOOL_DOWNLOAD_URL="$BALCOM_FLASH_TOOL_DOWNLOAD_URL" \
            -DBALCOM_FLASH_TOOL_SHA256="$BALCOM_FLASH_TOOL_SHA256"

      - name: Build installer
        shell: msys2 {0}
        id: build_installer
        continue-on-error: true
        run: |
          set -euo pipefail
          cmake --build --preset win-installer

      - name: Dump NSIS log if installer build failed
        if: steps.build_installer.outcome != 'success'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $roots = @(
            "build/win-release-installer/_CPack_Packages",
            (Join-Path -Path $env:RUNNER_TEMP -ChildPath "cpack-tmp")
          )
          foreach ($r in $roots) {
            if (Test-Path -LiteralPath $r) {
              Write-Host "Listing NSIS logs under $r ..."
              Get-ChildItem -Path $r -Recurse -File -Filter "NSISOutput.log" |
                ForEach-Object { Write-Host "--- $($_.FullName) ---"; Get-Content $_.FullName -Tail 250 }
              Write-Host "Listing NSIS scripts under $r ..."
              Get-ChildItem -Path $r -Recurse -File -Filter "project.nsi" |
                ForEach-Object { Write-Host "--- $($_.FullName) ---"; Get-Content $_.FullName -Tail 80 }
            }
          }
          exit 1

      - name: Verify staged install tree (GTK runtime bundled)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $stageRoots = @(
            "build/win-release-installer/_CPack_Packages",
            (Join-Path -Path $env:RUNNER_TEMP -ChildPath "cpack-tmp")
          )

          $exe = $null
          foreach ($root in $stageRoots) {
            if (-not (Test-Path -LiteralPath $root)) { continue }
            $exe = Get-ChildItem -Path $root -Recurse -File -Filter "BalCom1A Configuration Utility.exe" |
              Select-Object -First 1
            if ($exe) { break }
          }
          if (-not $exe) {
            throw "Staged EXE not found under: $($stageRoots -join ', ')"
          }

          # Use DirectoryName to guarantee we have a plain string path.
          $stage = $exe.DirectoryName
          Write-Host "Staged install dir: $stage"

          $requiredFiles = @(
            (Join-Path -Path $stage -ChildPath "BalCom1A Configuration Utility.exe"),
            (Join-Path -Path $stage -ChildPath "glade.ui"),
            (Join-Path -Path $stage -ChildPath "esptool.exe"),
            (Join-Path -Path $stage -ChildPath "libgtk-4-1.dll"),
            (Join-Path -Path $stage -ChildPath "libglib-2.0-0.dll"),
            (Join-Path -Path $stage -ChildPath "share/glib-2.0/schemas/gschemas.compiled")
          )

          foreach ($p in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $p)) {
              throw "Missing required bundled file in installer stage: $p"
            }
          }

          $pixbufCache = Get-ChildItem -Path (Join-Path $stage "lib/gdk-pixbuf-2.0") -Recurse -File -Filter "loaders.cache" |
            Select-Object -First 1
          if (-not $pixbufCache) {
            throw "Missing gdk-pixbuf loaders.cache under $stage\\lib\\gdk-pixbuf-2.0"
          }

          $adwaitaDir = Join-Path -Path $stage -ChildPath "share/icons/Adwaita"
          $hicolorDir = Join-Path -Path $stage -ChildPath "share/icons/hicolor"
          if (-not (Test-Path -LiteralPath $adwaitaDir)) {
            throw "Missing Adwaita icons under staged install: $adwaitaDir"
          }
          if (-not (Test-Path -LiteralPath $hicolorDir)) {
            throw "Missing hicolor icons under staged install: $hicolorDir"
          }

      - name: Locate installer
        id: locate_installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          # CPack should place the NSIS installer under CPACK_PACKAGE_DIRECTORY (build/win-release-installer),
          # but to be robust we search recursively (some CPack/NSIS layouts put it under _CPack_Packages).
          $candidates = Get-ChildItem -Path "build/win-release-installer" -Recurse -File -Filter "BalCom1A Configuration Utility-*.exe"

          $candidates |
            Select-Object FullName, Length, LastWriteTime |
            Sort-Object LastWriteTime |
            Format-Table -AutoSize

          if (-not $candidates) {
            Write-Host "Listing top-level build/win-release-installer/*.exe for debugging:"
            Get-ChildItem -Path "build/win-release-installer" -File -Filter "*.exe" |
              Select-Object FullName, Length, LastWriteTime |
              Format-Table -AutoSize
            throw "Installer not found under build/win-release-installer (recursive search)"
          }

          # Pick the newest candidate and copy it to a single, stable path for release upload.
          # This avoids uploading duplicates when the same filename exists under _CPack_Packages.
          $installer = $candidates | Sort-Object LastWriteTime -Descending | Select-Object -First 1
          $releaseDir = "build/release-assets"
          New-Item -ItemType Directory -Force -Path $releaseDir | Out-Null
          $releasePath = Join-Path -Path $releaseDir -ChildPath $installer.Name
          Copy-Item -LiteralPath $installer.FullName -Destination $releasePath -Force
          Write-Host "Release installer: $releasePath"
          "installer_path=$releasePath" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.locate_installer.outputs.installer_path }}
            build/esptool-asset/esptool.exe
          generate_release_notes: true

  build-linux-deb:
    runs-on: ubuntu-22.04
    needs: build-windows-installer

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: packaging/flasher/requirements-ci.txt

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            libgtk-4-dev \
            fakeroot dpkg-dev

      - name: Build standalone esptool (PyInstaller)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r packaging/flasher/requirements-ci.txt

          mkdir -p build/flasher

          python -m PyInstaller packaging/flasher/esptool_wrapper.py \
            --onefile \
            --name esptool \
            --distpath build/flasher \
            --workpath build/flasher/_pyi_build \
            --specpath build/flasher/_pyi_spec

          test -f build/flasher/esptool

      - name: Configure (DEB preset)
        run: |
          cmake --preset linux-release-deb-ci

      - name: Build DEB
        run: |
          cmake --build --preset linux-deb-ci

      - name: Locate DEB
        run: |
          ls -la build/linux-release-deb-ci || true
          find build/linux-release-deb-ci -maxdepth 1 -type f -name "*.deb" -print -ls

      - name: Upload .deb to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/linux-release-deb-ci/*.deb
          fail_on_unmatched_files: true
